[workspace]
resolver = "2"
members = [
    "crates/aristo",
    "crates/aristo-core",
    "crates/aristo-macros",
    "crates/aristo-cli",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/aretta-ai/aristo"
homepage = "https://github.com/aretta-ai/aristo"
rust-version = "1.88"
authors = ["Aretta <hello@aretta.ai>"]
# Workspace-level keywords inherited by all 4 crates via
# `keywords.workspace = true`. Max 5 entries; lowercase, no spaces;
# crates.io facet search uses these.
keywords = ["annotation", "verification", "intent", "proof", "sdk"]
# NOTE: `readme` is NOT inherited via workspace.package because cargo
# resolves the workspace-inherited value relative to each crate's dir
# AFTER appending the workspace-relative prefix, producing wrong paths
# (e.g. `../../../../README.md` for a crate at `crates/<name>/`).
# Each crate's manifest sets `readme = "../../README.md"` directly.

[workspace.dependencies]
aristo = { path = "crates/aristo", version = "0.3.1" }
aristo-core = { path = "crates/aristo-core", version = "0.3.1" }
# default-features = false at the workspace level so the `aristo` meta-crate
# can route the user's `aristo_check` feature through (member crates that
# want defaults on can override per-dep, and the macro crate itself has
# its own default-on for direct `cargo test` runs).
aristo-macros = { path = "crates/aristo-macros", version = "0.3.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Conservative defaults; tighten as the codebase grows.
all = { level = "deny", priority = -1 }
