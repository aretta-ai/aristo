# Aristo CI gates — dogfood configuration for the aristo SDK itself.
#
# Sibling projects use the template `aristo init` writes (which calls
# `cargo install aristo-cli --locked` to fetch the published crate — the
# `aristo` binary ships in the aristo-cli crate). This repo dogfoods the
# in-tree build instead, invoking it via `cargo run --release --bin aristo`.
#
# Gate order: `verify --audit` first (the freshness gate — regenerates the
# index from source + .aristo/proofs/ and reports stale/refuted/orphan; it
# replaces the old `stamp --check` now that the index is a gitignored cache),
# lint second (cheapest static check), doc third (derived from source). Each
# step is non-mutating.
#
# NOTE: the audit runs NON-strict here because the dogfood currently has a few
# pre-existing stale proofs (code drifted from its verdict; re-verify via the
# aristo-verify skill). Flip to `verify --audit --strict` once those are
# re-verified. Fresh consumer repos (no stale debt) get `--strict` from the
# `aristo init --ci` starter template.
#
# The `verify --check --strict` step is intentionally OMITTED. The
# verify command surfaces `CliError::NotImplemented` whenever the
# workspace has any `verify="test"` annotation — the test pipeline
# is post-MVP per `docs/deferred/verify-test-design.md`. Including it
# would make this workflow fail on the SDK's own code (many test
# annotations) AND on any downstream project that uses `verify="test"`.
# Re-add this step once slice 24 (free-tier test path) ships.
name: aristo
on: [push, pull_request]
jobs:
  aristo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (release, single shared rebuild for all gates)
        run: cargo build --release --bin aristo
      - name: verify --audit (proofs fresh vs source; replaces stamp --check)
        run: cargo run --release --bin aristo -- verify --audit
      - name: lint --check --strict (no warn/error findings)
        run: cargo run --release --bin aristo -- lint --check --strict
      - name: doc --check (doc artifacts in sync with source)
        run: cargo run --release --bin aristo -- doc --check
      - name: status (per-pipeline rate + tier — informational)
        run: cargo run --release --bin aristo -- status
      - name: badge (regenerate SVG)
        run: cargo run --release --bin aristo -- badge --out=docs/badge.svg
      - name: upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: aristo-badge
          path: docs/badge.svg
