# Aristo CI — the GOLDEN REFERENCE for wiring Aristo into CI.
#
# A consumer repo needs just two steps:
#
#   - uses: actions/checkout@v4
#   - uses: aretta-ai/aristo-action@v1
#     with: { checks: audit, lint, doc }
#
# This repo IS the source of the `aristo` binary, so it has exactly ONE
# deviation: it builds the binary from THIS commit (install: false) instead of
# installing the published crate — otherwise its own CI would test the last
# release, not the PR. Everything else is identical to a consumer setup.
#
# Server-side canon `verify` is a separate, token-gated workflow, not part of
# this lite gate.
name: aristo
on: [push, pull_request]
jobs:
  aristo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The one SDK-self deviation: install THIS commit's binary, not crates.io.
      # Consumers omit this and let the action install the published crate.
      - name: install in-tree aristo (this commit)
        run: cargo install --path crates/aristo-cli --locked --force
      - uses: aretta-ai/aristo-action@v1
        with:
          install: false # use the in-tree binary above (SDK-self only)
          # TEMPORARY: 4 pre-existing dogfood proofs are stale (code drifted;
          # re-verify via the aristo-verify skill). Remove this line to restore
          # the recommended strict gate. Consumers should NOT set it — the
          # default (strict) reds on any stale/refuted/orphan proof + lint warn.
          strict: false
          checks: audit, lint, doc, status
      # Dogfood-only: publish the badge SVG artifact (not part of the gate).
      - name: badge (regenerate SVG)
        run: aristo badge --out=docs/badge.svg
      - name: upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: aristo-badge
          path: docs/badge.svg
