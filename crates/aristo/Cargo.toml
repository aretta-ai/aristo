[package]
name = "aristo"
description = "Aristo SDK — annotation macros and verification (meta-crate)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["aristo_check"]
# Pass-through to aristo-macros/aristo_check; see that crate for rationale.
aristo_check = ["aristo-macros/aristo_check"]
# Pass-through to aristo-macros/aristo_doc — gates rustdoc injection of
# `.aristo/doc/<id-safe>.md` content above each annotated item. Slice 30.
aristo_doc = ["aristo-macros/aristo_doc"]

[dependencies]
aristo-macros = { workspace = true }
