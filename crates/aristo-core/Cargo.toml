[package]
name = "aristo-core"
description = "Aristo SDK core: shared types, .aristo/index.toml schema, B5b verification, language registry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
rust-version.workspace = true
authors.workspace = true
documentation = "https://docs.rs/aristo-core"
categories = ["development-tools", "parsing"]

[lints]
workspace = true

[dependencies]
aristo = { workspace = true }
globset = "0.4"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
schemars = "0.8"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
# C source parsing for the C language front-end (annotation extraction).
# tree-sitter reads raw source with comments intact — unlike libclang, which
# runs after the preprocessor has stripped every comment.
tree-sitter = "0.24"
tree-sitter-c = "0.23"
# Blocking HTTP client for the canon API. `rustls` feature avoids
# OpenSSL system-dep so the CLI builds clean on every platform.
ureq = { version = "3.3", default-features = false, features = ["json", "rustls"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
